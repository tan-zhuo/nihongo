  <g data-w="16">
    <rect x="590" y="70" width="72" height="340" rx="36" fill="#9c7450"/>
    <rect x="598" y="78" width="56" height="324" rx="28" fill="#b9cfe3"/>
    <path d="M610 120c0-20 10-30 20-32" stroke="#ffffff" stroke-width="3"/>
    <path d="M568 440l22-30h72l22 30" stroke="#9c7450" stroke-width="4"/>
