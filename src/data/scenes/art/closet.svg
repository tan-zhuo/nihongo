  <g data-w="17">
    <path d="M706 330h28v108h-28z" fill="#3f3a34"/>
    <path d="M720 330v108" stroke="#8c867c"/>
    <path d="M696 240h48l8 20v76h-64v-76z" fill="#5b8a72"/>
    <path d="M720 240v96" stroke="#3d614f"/>
    <path d="M700 258l-26 20 8 48" stroke="#5b8a72" stroke-width="12"/>
    <circle cx="682" cy="330" r="7" fill="#f5d2b4"/>
    <path d="M744 258l18 10-8 60" stroke="#9dc0a8" stroke-width="12"/>
    <circle cx="754" cy="330" r="7" fill="#f5d2b4"/>
    <circle cx="720" cy="216" r="20" fill="#f5d2b4"/>
    <path d="M700 212c4-16 36-16 40 0-6-8-14-10-20-10s-14 2-20 10z" fill="#4a3b32" stroke="none"/>
    <path d="M714 222c2 2 10 2 12 0" stroke-width="1.5"/>
    <path d="M700 438h40M740 438h4M696 438h4"/>
