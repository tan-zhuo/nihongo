    <path d="M196 140l-10 70M196 140l10 70" stroke="#3b6a8c" stroke-width="2.5"/>
    <path d="M196 160l-20 20 12 30M196 160l20 20-12 30" fill="#4a7fa3"/>
    <path d="M172 240h6M214 240h6" />
