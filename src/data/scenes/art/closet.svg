  <g data-w="6">
    <path d="M196 116v-2c0-6 8-10 8-6" stroke-width="2.5"/>
    <path d="M166 150l30-22 30 22-4 136h-52z" fill="#4a7fa3"/>
    <path d="M158 150l8-20 30 4 30-4 8 20-6 36h-64z" fill="#4a7fa3"/>
