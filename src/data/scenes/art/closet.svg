  <g data-w="15">
    <path d="M458 436c0-14 6-24 18-24h12c4 10 12 12 26 12v12z" fill="#5e4634"/>
    <path d="M498 436c0-14 6-24 18-24h12c4 10 12 12 26 12v12z" fill="#5e4634"/>
    <path d="M476 412c6 6 14 8 22 8M516 412c6 6 14 8 22 8" stroke="#9c7450" stroke-width="1.5"/>
