  <g data-w="10">
    <path d="M466 116h18v16h-18z" fill="#b5463f"/>
    <path d="M466 132h18l6 100-15 30-15-30z" fill="#b5463f"/>
    <path d="M470 150l12 22M470 180l12 22M470 210l12 22" stroke="#f1b1aa" stroke-width="2"/>
