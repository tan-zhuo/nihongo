  <!-- coat -->
  <g data-w="5">
    <path d="M108 116v-2c0-6 8-10 8-6" stroke-width="2.5"/>
    <path d="M78 150l30-20 30 20-6 150h-48z" fill="#5e4634"/>
    <path d="M70 150l8-22 30 4 30-4 8 22-6 40h-64z" fill="#5e4634"/>
    <path d="M108 126l-18 16 18 38 18-38z" fill="#e3c9a3"/>
    <path d="M108 170v128" stroke="#3f3a34"/>
    <circle cx="104" cy="200" r="2" fill="#f0cf6d" stroke="none"/>
    <circle cx="104" cy="230" r="2" fill="#f0cf6d" stroke="none"/>
