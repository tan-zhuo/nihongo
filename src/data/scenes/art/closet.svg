  <g data-w="12">
    <circle cx="100" cy="304" r="12" fill="#5e4634" stroke-width="6" stroke="#5e4634"/>
    <circle cx="100" cy="304" r="12" stroke="#3f3a34"/>
    <circle cx="100" cy="304" r="5" fill="#ede9e1"/>
    <rect x="110" y="298" width="12" height="12" rx="2" fill="#f0cf6d"/>
