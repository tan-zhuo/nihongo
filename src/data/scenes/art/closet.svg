    <path d="M508 136h30M508 160h30M508 184h30M508 208h30M508 232h30" stroke="#d9736b" stroke-width="5"/>
    <path d="M512 266l-2 12M523 268v14M534 266l2 12" stroke="#f0cf6d" stroke-width="3"/>
