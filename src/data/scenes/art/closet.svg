  <g data-w="8">
    <path d="M350 116v-2c0-6 8-10 8-6" stroke-width="2.5"/>
    <path d="M330 140l20-10 20 10 6 50-52 0z" fill="#d9736b"/>
    <path d="M324 190h52l16 140h-84z" fill="#d9736b"/>
    <path d="M324 190h52" stroke="#b5463f"/>
    <path d="M334 210h30M340 240h26M346 270h22M352 300h18" stroke="#f1b1aa" stroke-width="1.5"/>
