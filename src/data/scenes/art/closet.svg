  <g data-w="14">
    <rect x="322" y="402" width="116" height="34" rx="2" fill="#cfc9bd"/>
    <rect x="322" y="368" width="116" height="34" rx="2" fill="#e59a5b"/>
    <rect x="322" y="334" width="116" height="34" rx="2" fill="#7da2c4"/>
