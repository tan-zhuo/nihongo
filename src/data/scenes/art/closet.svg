    <path d="M277 116v-2c0-6 8-10 8-6" stroke-width="2.5"/>
    <path d="M250 150l27-16 27 16-4 96h-46z" fill="#b9cfe3"/>
    <path d="M242 150l10-18 25 4 25-4 10 18-8 32h-54z" fill="#b9cfe3"/>
