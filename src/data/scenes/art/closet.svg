    <path d="M277 154v90" stroke="#7da2c4"/>
    <circle cx="277" cy="170" r="1.8" fill="#ffffff" stroke="none"/>
    <circle cx="277" cy="190" r="1.8" fill="#ffffff" stroke="none"/>
