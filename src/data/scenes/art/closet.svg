<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" stroke="#3f3a34" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
  <!-- wall and floor -->
  <rect x="0" y="0" width="800" height="500" fill="#f4efe6" stroke="none"/>
  <rect x="0" y="440" width="800" height="60" fill="#d8b48c" stroke="none"/>
  <path d="M0 470h800" stroke="#c49b6e" stroke-width="1.5"/>
  <path d="M0 440h800" stroke="#b08a63" stroke-width="3"/>

  <!-- closet box -->
  <rect x="40" y="30" width="520" height="410" fill="#ede9e1"/>
  <rect x="40" y="30" width="520" height="410" stroke="#9c7450" stroke-width="10" fill="none"/>
  <path d="M40 30v410M560 30v410" stroke="#9c7450" stroke-width="10"/>
  <path d="M22 60h18M22 60v380h18" stroke="#9c7450" stroke-width="6" fill="#e3c9a3"/>
  <!-- top shelf -->
  <g data-w="1">
    <rect x="46" y="94" width="508" height="10" fill="#d8b48c"/>
    <path d="M46 104h508" stroke="#9c7450"/>
  </g>
  <!-- hat -->
  <g data-w="2">
