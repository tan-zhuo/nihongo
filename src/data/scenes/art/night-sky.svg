<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" stroke="#3f3a34" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
  <!-- night sky -->
  <g data-w="13">
    <rect x="0" y="0" width="800" height="500" fill="#4a7fa3" stroke="none"/>
    <ellipse cx="400" cy="330" rx="520" ry="90" fill="#7da2c4" fill-opacity="0.45" stroke="none"/>
  </g>
  <!-- milky way -->
  <g data-w="5">
    <path d="M300 0c60 40 130 60 220 90s170 70 280 150V320c-90-70-170-110-260-140S330 100 250 0z" fill="#b9cfe3" fill-opacity="0.3" stroke="none"/>
    <path d="M340 0c50 30 110 50 190 76s150 60 270 130v70c-100-60-180-96-262-124S350 70 300 0z" fill="#d6e7f0" fill-opacity="0.3" stroke="none"/>
    <g fill="#ffffff" stroke="none">
      <circle cx="380" cy="30" r="1.5"/><circle cx="430" cy="60" r="2"/><circle cx="470" cy="100" r="1.5"/><circle cx="520" cy="120" r="2"/>
      <circle cx="560" cy="150" r="1.5"/><circle cx="610" cy="170" r="2"/><circle cx="650" cy="200" r="1.5"/><circle cx="700" cy="230" r="2"/>
      <circle cx="740" cy="250" r="1.5"/><circle cx="500" cy="80" r="1.5"/><circle cx="590" cy="130" r="1.5"/><circle cx="670" cy="160" r="1.5"/>
    </g>
  </g>
  <!-- small background stars -->
  <g fill="#ffffff" stroke="none">
    <circle cx="40" cy="60" r="2"/><circle cx="240" cy="120" r="2"/><circle cx="70" cy="280" r="1.5"/><circle cx="250" cy="250" r="2"/>
    <circle cx="380" cy="130" r="2"/><circle cx="520" cy="200" r="1.5"/><circle cx="640" cy="40" r="2"/><circle cx="770" cy="120" r="2"/>
    <circle cx="760" cy="40" r="1.5"/><circle cx="470" cy="250" r="1.5"/><circle cx="220" cy="300" r="1.5"/><circle cx="30" cy="180" r="1.5"/>
    <circle cx="300" cy="260" r="1.5"/><circle cx="760" cy="200" r="1.5"/><circle cx="200" cy="80" r="1.5"/><circle cx="660" cy="300" r="1.5"/>
  </g>

  <!-- moon -->
  <g data-w="1">
    <path d="M690 38a42 42 0 1 0 0 84a50 50 0 0 1 0-84z" fill="#f8e6ae"/>
    <circle cx="664" cy="66" r="4" fill="#f0cf6d" stroke="none"/>
    <circle cx="658" cy="92" r="6" fill="#f0cf6d" stroke="none"/>
  </g>

  <!-- cloud -->
  <g data-w="9">
    <path d="M280 96c-14 0-20-10-14-20 2-12 16-16 26-10 4-14 24-18 36-8 12-6 30 0 32 14 12 0 18 8 14 16 0 8-8 8-14 8z" fill="#ffffff" fill-opacity="0.92"/>
  </g>

  <!-- shooting star -->
  <g data-w="3">
    <path d="M480 66l110 42" stroke="#f8e6ae" stroke-width="5"/>
    <path d="M490 60l100 48" stroke="#ffffff" stroke-width="2"/>
    <path d="M608 102l5 12 13 1-10 8 3 13-11-7-11 7 3-13-10-8 13-1z" fill="#f0cf6d"/>
  </g>

  <!-- constellation (big dipper) -->
  <g data-w="4">
    <path d="M50 110l45 15 45-5 45 20 20 45-35 30-45-15" stroke="#f8e6ae" stroke-width="1.5"/>
    <g fill="#f0cf6d">
      <circle cx="50" cy="110" r="5"/><circle cx="95" cy="125" r="5"/><circle cx="140" cy="120" r="5"/><circle cx="185" cy="140" r="5"/>
      <circle cx="205" cy="185" r="5"/><circle cx="170" cy="215" r="5"/><circle cx="125" cy="200" r="5"/>
    </g>
  </g>

  <!-- star cluster -->
  <g data-w="2">
    <path d="M300 136l5 12 13 1-10 8 3 13-11-7-11 7 3-13-10-8 13-1z" fill="#f0cf6d"/>
    <path d="M268 170l4 9 10 1-8 6 3 10-9-5-9 5 3-10-8-6 10-1z" fill="#f8e6ae"/>
    <path d="M330 176l4 9 10 1-8 6 3 10-9-5-9 5 3-10-8-6 10-1z" fill="#f8e6ae"/>
  </g>

  <!-- planet (saturn) -->
  <g data-w="6">
    <g transform="rotate(-20 440 164)">
      <ellipse cx="440" cy="164" rx="46" ry="12" fill="#f8e6ae"/>
      <circle cx="440" cy="164" r="24" fill="#e59a5b"/>
      <path d="M422 156c10-4 26-4 36 0M418 172c12 4 32 4 44 0" stroke="#c97d3e" stroke-width="1.5"/>
      <path d="M394 164a46 12 0 0 0 92 0" stroke="#f8e6ae" stroke-width="7"/>
      <path d="M394 164a46 12 0 0 0 92 0"/>
    </g>
  </g>

  <!-- bright star -->
  <g data-w="14">
    <circle cx="590" cy="212" r="22" fill="#f8e6ae" fill-opacity="0.35" stroke="none"/>
    <path d="M590 176v12M590 236v12M554 212h12M614 212h12M566 188l8 8M606 228l8 8M614 188l-8 8M574 228l-8 8" stroke="#f8e6ae" stroke-width="2"/>
    <path d="M590 192l6 14 15 1-12 10 4 15-13-8-13 8 4-15-12-10 15-1z" fill="#f0cf6d"/>
  </g>

  <!-- rocket -->
  <g data-w="7" transform="rotate(30 720 220)">
    <path d="M706 248c0 14 7 24 14 30 7-6 14-16 14-30z" fill="#e59a5b"/>
    <path d="M713 248c0 9 3 14 7 18 4-4 7-9 7-18z" fill="#f0cf6d" stroke="none"/>
    <path d="M720 178c-14 0-22 22-22 44v26h44v-26c0-22-8-44-22-44z" fill="#ffffff"/>
    <path d="M698 226l-14 16v12l14-6zM742 226l14 16v12l-14-6z" fill="#d9736b"/>
    <circle cx="720" cy="212" r="8" fill="#7da2c4"/>
    <path d="M708 248h24" />
  </g>

  <!-- hill -->
  <g data-w="10">
    <path d="M0 350Q400 230 800 350V500H0z" fill="#5b8a72"/>
    <path d="M0 440c120-30 260-20 400 10s260 20 400-10v60H0z" fill="#3d614f" stroke="none"/>
  </g>

  <!-- tree -->
  <g data-w="11">
    <path d="M90 328v-50" stroke="#5e4634" stroke-width="7"/>
    <circle cx="90" cy="262" r="30" fill="#3d614f"/>
    <circle cx="66" cy="282" r="20" fill="#3d614f"/>
    <circle cx="116" cy="284" r="22" fill="#3d614f"/>
    <circle cx="80" cy="240" r="18" fill="#3d614f"/>
  </g>

  <!-- person looking through telescope -->
  <g data-w="15">
    <path d="M336 292v-40c0-10 8-18 18-18s18 8 18 18v40z" fill="#d9736b"/>
    <path d="M340 292v-14h10v14M358 292v-14h10v14" fill="#5e4634"/>
    <circle cx="354" cy="222" r="14" fill="#f5d2b4"/>
    <path d="M340 218c4-10 24-10 28 0-5-4-9-6-14-6s-9 2-14 6z" fill="#4a3b32" stroke="none"/>
    <path d="M360 226c1 2 4 2 5 0" stroke-width="1.5"/>
    <path d="M370 250l22-8" stroke-width="4"/>
  </g>

  <!-- telescope -->
  <g data-w="8">
    <path d="M402 246l-18 46M402 246l18 46M402 246v48" stroke-width="3"/>
    <path d="M388 280h28" />
    <g transform="rotate(-35 402 244)">
      <rect x="392" y="236" width="76" height="16" rx="4" fill="#8c867c"/>
      <rect x="458" y="232" width="18" height="24" rx="3" fill="#cfc9bd"/>
      <rect x="384" y="239" width="10" height="10" rx="2" fill="#3f3a34"/>
    </g>
    <circle cx="402" cy="246" r="4" fill="#3f3a34"/>
  </g>

  <!-- blanket with person lying down -->
  <g data-w="16">
    <path d="M530 328l18-26h130l-18 26z" fill="#a58bc0"/>
    <path d="M550 316h110M560 309h110" stroke="#8b70a8" stroke-width="1.5"/>
    <rect x="534" y="304" width="38" height="12" rx="6" fill="#5e4634"/>
    <rect x="566" y="300" width="60" height="16" rx="8" fill="#4a7fa3"/>
    <circle cx="638" cy="304" r="12" fill="#f5d2b4"/>
    <path d="M646 294c-4-8-18-10-22 0 6-2 12-2 22 0z" fill="#4a3b32" stroke="none"/>
    <path d="M634 306c1 2 3 2 4 0" stroke-width="1.5"/>
  </g>

  <!-- flashlight -->
  <g data-w="12">
    <path d="M510 388l76-26v80l-76-26z" fill="#f8e6ae" fill-opacity="0.55" stroke="none"/>
    <rect x="438" y="394" width="56" height="16" rx="5" fill="#8c867c"/>
    <rect x="492" y="388" width="18" height="28" rx="3" fill="#cfc9bd"/>
    <path d="M450 402h30" stroke="#5e4634" stroke-width="1.5"/>
  </g>

  <!-- fireflies -->
  <g data-w="17">
    <g fill="#f0cf6d" fill-opacity="0.3" stroke="none">
      <circle cx="180" cy="396" r="12"/><circle cx="214" cy="378" r="12"/><circle cx="244" cy="402" r="12"/><circle cx="200" cy="420" r="10"/>
    </g>
    <g fill="#f0cf6d" stroke="none">
      <circle cx="180" cy="396" r="6"/><circle cx="214" cy="378" r="6"/><circle cx="244" cy="402" r="6"/><circle cx="200" cy="420" r="5"/>
    </g>
    <path d="M176 392c-2-4-6-6-8-4M218 374c2-4 6-6 8-4M240 398c-2-4-6-6-8-4" stroke-width="1.5"/>
  </g>
</svg>
